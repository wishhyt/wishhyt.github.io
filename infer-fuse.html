<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-src blob:; object-src blob:; base-uri 'none'; form-action 'none'">
  <title>Infer&amp;Fuse | Yutong Huang</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-paper="infer-fuse">
  <main class="shell">
    <header class="masthead"><p class="owner">Yutong Huang</p></header>
    <section class="gate" id="gate" aria-labelledby="gate-title">
      <h1 id="gate-title">Opening your paper</h1>
      <p class="intro" id="introduction">Verifying access...</p>
    </section>
    <section class="library" id="library" hidden aria-labelledby="paper-title">
      <h1 id="paper-title" tabindex="-1">Research papers</h1>
      <div id="viewer">
        <div class="viewer-tools">
          <a class="button" id="open-pdf" target="_blank" rel="noopener noreferrer">Open PDF</a>
          <a class="button" id="download" download>Download PDF</a>
        </div>
        <iframe id="paper-frame" title="Research manuscript"></iframe>
      </div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="footer">Access shared by the author.</p>
  </main>
</body>
</html>
